name: GPU Simulator

# Optional, non-required check. The hosted runners have no GPU, so the
# "if cuda.is_available()" parts of the tests are skipped in algotom_ga.yml
# and the numba CUDA kernels are never run there. This runs those tests with
# real PTX on a simulated NVIDIA H100
# (https://github.com/pantheongpu/pantheonsim). A simulator cannot reproduce
# hardware-specific behavior, races or real-device precision, so it
# complements real-GPU testing and does not replace it.

on:
  workflow_dispatch:
  pull_request:
    branches: [master, dev]
    paths:
      - "algotom/rec/reconstruction.py"
      - "algotom/rec/vertrec.py"
      - "algotom/util/correlation.py"
      - "tests/test_rec/**"
      - "tests/test_util/test_correlation.py"
      - "setup.py"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cuda-tests:
    name: CUDA tests (CUDA 13.0 and simulated H100)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@68edfd58c091361dd6baf060b63de412e544d858 # v0.1.7
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"

      # numba-cuda provides numba.cuda. numpy is kept below 2.5 because
      # numba-cuda 0.30 still uses np.row_stack, and cuda-core below 1.3
      # because the simulator does not resolve one driver function that
      # cuda-core 1.3 requires.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install . numba-cuda "numpy<2.5" "cuda-core<1.3"

      # numba-cuda finds libNVVM in the toolkit through CUDA_HOME.
      - name: Check that the simulated GPU is visible
        env:
          CUDA_HOME: /usr/local/cuda-13.0
        run: |
          vgpu run python -c "from numba import cuda; assert cuda.is_available(); print(cuda.get_current_device().name)"

      # The tests only take their GPU path when cuda.is_available() is True,
      # so a missing device would pass silently. The runner below records
      # which tests asked and fails if any of them got False.
      - name: Run the CUDA tests
        env:
          CUDA_HOME: /usr/local/cuda-13.0
        run: |
          cat > "$RUNNER_TEMP/run_gpu_tests.py" <<'PY'
          import os
          import sys
          import unittest

          from numba import cuda

          real_is_available = cuda.is_available
          gpu_tests, cpu_only = set(), set()


          def is_available():
              ok = real_is_available()
              frame = sys._getframe(1)
              if frame.f_code.co_name.startswith("test_"):
                  name = frame.f_globals["__name__"] + "." + frame.f_code.co_name
                  (gpu_tests if ok else cpu_only).add(name)
              return ok


          cuda.is_available = is_available
          sys.path.insert(0, os.getcwd())
          prog = unittest.main(module=None, argv=sys.argv, exit=False, verbosity=2)
          print(f"\nGPU branch taken in {len(gpu_tests)} tests:")
          for name in sorted(gpu_tests):
              print("  " + name)
          if cpu_only or not gpu_tests:
              sys.exit(f"GPU branch skipped in: {sorted(cpu_only)}")
          sys.exit(not prog.result.wasSuccessful())
          PY
          vgpu run python "$RUNNER_TEMP/run_gpu_tests.py" \
            tests.test_rec.test_reconstruction \
            tests.test_rec.test_vertrec \
            tests.test_util.test_correlation
